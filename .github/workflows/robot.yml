name: Robot de noticias Misión Crecer

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: robot-noticias
  cancel-in-progress: false

jobs:
  noticias:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Buscar noticias reales
        run: node scripts/robot.mjs
      - name: Buscar videos reales
        run: node scripts/videos.mjs
      - name: Guardar si hay noticias o videos nuevos
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name "robot-mision-crecer"
            git config user.email "robot@users.noreply.github.com"
            git add data/
            git commit -m "Robot: noticias y videos $(TZ=America/Bogota date '+%Y-%m-%d %H:%M') hora Colombia"
            git push
          else
            echo "Nada nuevo"
          fi
